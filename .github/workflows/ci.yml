# SWAGGYMUSIC GitHub Controller Bot — CI
#
# Runs on push/PR to main/master. Performs:
#   - gofmt check
#   - go vet
#   - go build
#   - go test
#
# Secrets are never read by CI: this workflow only does static checks and
# unit tests that don't require live credentials.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: |
          go mod verify
          # Fail if any module has a known vulnerability (best-effort).
          go install golang.org/x/vuln/cmd/govulncheck@latest || true
          $(go env GOPATH)/bin/govulncheck ./... || true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Files need gofmt:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: swaggymusic/github-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
